[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golazo"
version = "0.1.0"
description = "Predicción calibrada de resultados de fútbol, con backtest verificable"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Fabian" }]
keywords = ["football", "soccer", "prediction", "dixon-coles", "elo", "calibration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
web = ["flask>=3.0,<4"]
reports = ["matplotlib>=3.7,<4"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
golazo-train = "golazo.cli:train_main"
golazo-backtest = "golazo.cli:backtest_main"
golazo-predict = "golazo.cli:predict_main"
golazo-score = "golazo.cli:score_main"

[tool.setuptools.packages.find]
include = ["golazo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
markers = ["slow: tests que reconstruyen features completas"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["golazo"]
omit = ["*/cli.py"]
